# Builds the Windows version on every push to main, attaches the zip to a
# GitHub Release (the newest one is "latest") and publishes the download page
# in site/ to GitHub Pages. The zip is over 100 MB, so it lives in Releases,
# not on Pages.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: windows-build
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  ZIP_NAME: SpaceMajesty-windows.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and Windows export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-windows-v1

      - name: Download Godot and Windows templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          # The template archive is about 1.3 GB; keep only what Windows needs.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -j /tmp/templates.tpz \
            templates/version.txt \
            templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe \
            -d "$tdir"
          rm /tmp/templates.tpz /tmp/godot.zip

      - name: Import project
        run: |
          # The first import can exit non-zero while it builds the cache; the
          # export below fails loudly if anything is really missing.
          ~/godot/godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          set -e
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/SpaceMajesty.exe
          test -f build/windows/SpaceMajesty.exe
          test -f build/windows/SpaceMajesty.pck
          cd build/windows
          zip -qr "../${ZIP_NAME}" .
          ls -la ..

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Windows build from commit ${{ github.sha }}.
            Download ${{ env.ZIP_NAME }}, unzip it and run SpaceMajesty.exe.
          make_latest: true
          files: build/${{ env.ZIP_NAME }}

      - name: Prepare download page
        run: |
          set -e
          mkdir -p _site
          cp site/index.html _site/index.html
          sed -i \
            -e "s|__REPO__|${GITHUB_REPOSITORY}|g" \
            -e "s|__ZIP__|${ZIP_NAME}|g" \
            -e "s|__BUILD__|${GITHUB_RUN_NUMBER}|g" \
            -e "s|__COMMIT__|${GITHUB_SHA::7}|g" \
            -e "s|__DATE__|$(date -u +'%Y-%m-%d %H:%M UTC')|g" \
            _site/index.html
          size=$(du -m "build/${ZIP_NAME}" | cut -f1)
          sed -i "s|__SIZE__|${size}|g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
